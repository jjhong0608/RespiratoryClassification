<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="1000" fill="#f0f4f8"/>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e3a5f">🎧 Respiratory MIL Model Architecture</text>
  
  <!-- Main Flow Container -->
  <!-- Input Box -->
  <g transform="translate(100, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="600" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e3a5f">INPUT: Audio Segments</text>
    <text x="300" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555">segments (B, M, n_mels, n_frames)</text>
  </g>
  
  <!-- Arrow 1 -->
  <line x1="400" y1="150" x2="400" y2="180" stroke="#1e3a5f" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Whisper Encoder Box -->
  <g transform="translate(100, 180)" filter="url(#shadow)">
    <rect x="0" y="0" width="600" height="150" rx="10" fill="#1e3a5f" stroke="#3a7ca5" stroke-width="2"/>
    <text x="300" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🎤 Whisper Audio Encoder</text>
    <text x="300" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Conv1d → Conv1d → Positional Embedding → Transformer Blocks</text>
    <text x="300" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">├─ MultiHeadAttention (Q,K,V,Out)</text>
    <text x="300" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">├─ LayerNorm + Residual Connection</text>
    <text x="300" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#cccccc">└─ MLP: Linear → GELU → Linear</text>
  </g>
  
  <!-- Arrow 2 -->
  <line x1="400" y1="330" x2="400" y2="360" stroke="#1e3a5f" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Token Pooling Box -->
  <g transform="translate(100, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="600" height="70" rx="10" fill="#2e5f8f" stroke="#4a8fc5" stroke-width="2"/>
    <text x="300" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🔍 Token Attention Pooling</text>
  </g>
  
  <!-- Arrow 3 -->
  <line x1="400" y1="430" x2="400" y2="460" stroke="#1e3a5f" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Instance Head & MIL Box -->
  <g transform="translate(100, 460)" filter="url(#shadow)">
    <rect x="0" y="0" width="600" height="100" rx="10" fill="#3e7faf" stroke="#5a9fd5" stroke-width="2"/>
    <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🎯 Instance Head → 📦 MIL Aggregation</text>
    <text x="150" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Instance Head:</text>
    <text x="280" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Aggregator Types:</text>
    <text x="150" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cccccc">Linear/MLP (input_dim → 1)</text>
    <text x="280" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cccccc">• Attention (gated, weighted)</text>
    <text x="280" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cccccc">• Max (max pooling)</text>
    <text x="280" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cccccc">• Top-K (top-k pooling)</text>
  </g>
  
  <!-- Arrow 4 -->
  <line x1="400" y1="560" x2="400" y2="590" stroke="#1e3a5f" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Output Box -->
  <g transform="translate(100, 590)" filter="url(#shadow)">
    <rect x="0" y="0" width="600" height="70" rx="10" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e3a5f">OUTPUT: Classification</text>
    <text x="300" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555">Bag-level Logits → Classification Scores</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e3a5f"/>
    </marker>
  </defs>
</svg>
